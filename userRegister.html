<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Wallet - Login</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/userRegister.css">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="./js/userRegister.js" defer></script>  
</head>
<body>
    <div id="alertDanger" class="alert alert-danger" role="alert">
        Datos incorrectos o incompletos!
    </div>
    <div class="container">
        <h2>Registro de usuario</h2>
        <form id="registerForm">
            <div class="form-group">
                <label for="inpuRut">Rut:</label>
                <input id="inpuRut" name="inpuRut" type="text" class="form-control" placeholder="Ej.: 12345678-9" maxlength="10" required>
            </div>
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input id="nombre" name="nombre" type="text" class="form-control" placeholder="Ingresa tu nombre" maxlength="50" required>
            </div>
            <div class="form-group">
                <label for="email">email:</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Ingresa un correo electrónico válido" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" class="form-control" id="password" placeholder="Debe tener entre 8 y 20 carácteres" maxlength="20" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirmar Password:</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Repite la constraseña" maxlength="20" required>
            </div>
            <div class="button-group">
                <a type="button" class="btn btn-primary" href="index.html">Cancelar</a>
                <button type="submit" class="btn btn-success">Crear cuenta</button>
            </div>
        </form>
    </div>

    <!-- Modal -->
    <div id="msgModal" class="modal fade" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="modalLabel">Información</h2>
            </div>
            <div id="modalBody" class="modal-body">
                ...
            </div>
            <div class="modal-footer">
                <button id="btnCloseModal" type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
            </div>
            </div>
        </div>
    </div>
</body>
</html>
