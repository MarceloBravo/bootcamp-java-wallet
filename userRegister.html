<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Wallet - Login</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/userRegister.css">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>

    <script src="./js/userRegister.js" defer></script>  
    <script src="./js/utils.js" defer></script>  
    <script src="./js/modal.js" defer></script>  
</head>
<body>
    <div class="container">
        <h2>Registro de usuario</h2>
        <form id="registerForm">
            <div class="form-group">
                <label for="rut">Rut:</label>
                <input id="rut" name="rut" type="text" class="form-control" placeholder="Ej.: 12345678-9" maxlength="10" required>
                <div class="msgError" id="msgRut"></div>
            </div>
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input id="nombre" name="nombre" type="text" class="form-control" placeholder="Ingresa tu nombre" maxlength="50" required>
                <div class="msgError" id="msgNombre"></div>
            </div>
            <div class="form-group">
                <label for="email">email:</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Ingresa un correo electrónico válido" required>
                <div class="msgError" id="msgEmail"></div>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" class="form-control" id="password" placeholder="Debe tener entre 8 y 20 carácteres" maxlength="20" required>
                <div class="msgError" id="msgPassword"></div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirmar Password:</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Repite la constraseña" maxlength="20" required>
                <div class="msgError" id="msgConfirmPassword"></div>
            </div>
            <div class="button-group">
                <a type="button" class="btn btn-primary" href="index.html">Cancelar</a>
                <button type="submit" class="btn btn-success">Crear cuenta</button>
            </div>
        </form>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Modal title</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div id="modalBody" class="modal-body">
                    ...
                </div>
                <div class="modal-footer">
                    <button id="btnSecondaryModal" type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
                    <a id="btnPrimaryModal" type="button" class="btn btn-primary" href="./index.html">Aceptar</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
