<!DOCTYPE html>
<html>
<head>
    <title>Wallet - Menú Principal</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/menu.css">
    <link rel="stylesheet" href="./styles/navbar.css">
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>

    <script src="./js/utils.js" defer></script>
    <script src="./js/modal.js" defer></script> 
    <script src="./js/dashboard.js" defer></script>
    <script src="./js/navbar.js" defer></script>
</head>
<body>
    <div class="main-container">
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <a class="navbar-brand" href="#">Alke Wallet</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarText">
                <ul class="navbar-nav mr-auto">
                <li class="nav-item active">
                    <a class="nav-link" href="#">Dashboard </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="deposit.html">Depositos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="sendmoney.html">Envios</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="transactions.html">Historial</a>
                </li>
                </ul>
                <span id="spnLogout" class="navbar-text">
                    Cerrar Sesión
                </span>
            </div>
        </nav>



        <div class="container">
            <h2>Menú Principal</h2>
            <div class="form-group">
                <label for="balance">Dinero en cuenta:</label>
                <h3 id="h-monto"></h3>
            </div>
            <div class="form-group">
                <button id="btnDeposit" class="btn btn-primary">
                    <img src="assets/deposit.png" alt="Depositar"/>
                </button>
                <button id="btnSendMoney" class="btn btn-primary">
                    <img src="assets/sendmoney.png" alt="Enviar Dinero"/>
                </button>
                <button id="btnTransactions" class="btn btn-primary">
                    <img src="assets/transactions.png" alt="Historial"/>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
