<!DOCTYPE html>
<html>
    <head>
    <title>Wallet - Login</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/index.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <script src="./js/utils.js" defer></script>  
    <script src="./js/login.js" defer></script> 
    <script src="./js/modal.js" defer></script> 
</head>
<body>
    <div class="container container-login">
        <h2><span class="text-primary">A</span>lke wallet</h2>
        <form id="loginForm">
            <div class="form-group">
                <input id="email" name="email" type="email" class="form-control" placeholder="Ingresa tu email">
            </div>
            <div class="form-group">
                <input type="password" class="form-control" id="password" placeholder="Ingresa tu password" name="password">
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary btn-login">Login</button>
            </div>
            <div class="link-register">
                <a href="userRegister.html">¿No tienes cuenta? Registrate aquí</a>
            </div>
        </form>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Modal title</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div id="modalBody" class="modal-body">
                    ...
                </div>
                <div class="modal-footer">
                    <button id="btnSecondaryModal" type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
                    <a id="btnPrimaryModal" type="button" class="btn btn-primary" href="./index.html">Aceptar</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
