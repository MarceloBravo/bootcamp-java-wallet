<!DOCTYPE html>
<html>

<head>
  <title>Wallet - Enviar Dinero</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <link rel="stylesheet" href="./styles/style.css">
  <link rel="stylesheet" href="./styles/sendmoney.css">
  <link rel="stylesheet" href="./styles/navbar.css">

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>

  <script src="./js/modal.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/sendmoney.js"></script>
  <script src="./js/navbar.js" defer></script>
</head>

<body>
  <div class="background-screen"></div>
  <div class="main-container">
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <a class="navbar-brand" href="#"><span class="text-primary">A</span>lke Wallet</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarText"
        aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarText">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item">
            <a class="nav-link" href="dashboard.html">Dashboard </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="deposit.html">Depositos</a>
          </li>
          <li class="nav-item active">
            <a class="nav-link" href="#">Envios</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="transactions.html">Historial</a>
          </li>
        </ul>
        <span id="spnLogout" class="navbar-text">
          Cerrar Sesión
        </span>
      </div>
    </nav>

    <div class="container">
      <h2>Enviar Dinero</h2>
      <div id="div-transaccion" class="transaccion">
        <h3 class="h3-saldo">Saldo:
          <span id="h-monto">$ 0</span>
        </h3>
        <div class="destinatario">

        </div>
        <div class="form-group monto-envio">
          <div class="form-group row">
            <label for="txt-monto" class="col-sm-3 col-form-label">Monto a enviar</label>
            <div class="col-sm-9">
              <input type="number" class="form-control" id="inputMonto" value="" placeholder="0">
            </div>
          </div>
          <div class="msgError" id="msgSendAmount"></div>
          <div class="form-group container-buttons">
            <button id="btnEnviarDinero" type="button" class="btn btn-icon">
              <img src="assets/sendmoney.png" alt="Enviar Dinero"/>
            </button>
            <button id="btnBackToMenu" type="button" class="btn btn-icon">
              <img src="assets/home.png" alt="Enviar Dinero"/>
            </button>
          </div>

        </div>
      </div>
      
      
        
      <div id="div-contactos" class="contactos">
        <h3>Selecciona el destinatario</h3>
        <div class="form-group">
          <input type="text" class="form-control" id="searchContact" placeholder="Buscar en la agenda de contactos">
        </div>

        <div class="row conatiner-add-contact">
          <h3>Contactos</h3>
          
        </div>
        <ul id="contactList" class="list-group">

        </ul>

        <div class="form-group container-buttons">
          <button id="btnExecuteTransaction" type="button" class="btn btn-icon">
              <img src="assets/sendmoney.png" alt="Enviar Dinero"/>
          </button>
          <button id="btnShowModal" type="button" class="btn btn-icon" data-bs-toggle="modal" data-bs-target="#ModalContacto">
              <img src="assets/add_user.png" alt="Enviar Dinero"/>
          </button>  
          <button id="btnBack" type="button" class="btn btn-icon">
              <img src="assets/rewind-blue-left-arrows.png" alt="Enviar Dinero"/>
          </button>  
        </div>
      </div>
        
    </div>
    <table id="alertInfo" class="alert alert-info" role="alert">
      <thead>
        <th>Contacto</th>
        <th>Eliminar</th>
      </thead>
      <tbody>
        A simple info alert—check it out!
      </tbody>
    </table>

    <!-- Modal nuevo contacto -->
    <div class="modal fade" id="ModalContacto" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div id="alertDangerModal" class="alert alert-danger" role="alert">
        Datos incorrectos o incompletos!
      </div>
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Nuevo contacto</h1>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <input type="text" class="form-control" id="inputNombre" placeholder="Nombre del contacto">
            </div>
            <div class="mb-3">
              <input type="text" class="form-control" id="inputApellido" placeholder="Apellido del contacto">
            </div>
            <div class="mb-3">
              <input type="number" class="form-control" id="inputCBU" placeholder="Número CBU">
            </div>
            <div class="mb-3">
              <input type="text" class="form-control" id="inputAlias" placeholder="Alias">
            </div>
            <div class="mb-3">
              <input type="text" class="form-control" id="inputBanco" placeholder="Banco">
            </div>
          </div>
          <div class="modal-footer">
            <button id="btnNuevoContacto" type="button" class="btn btn-primary">Agregar nuevo contacto</button>
            <button id="btnCerrarModal" type="button" class="btn btn-secondary"
              data-bs-dismiss="modal">Cancelar</button>
          </div>
        </div>
      </div>
    </div>
    <!-- /Modal nuevo contacto -->


    <!-- Modal Formulario Monto de envío -->
    <div class="modal fade" id="ModalMontoEnvio" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
      aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="exampleModalLabel">Monto a enviar</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <div class="form-group">
              <label for="sendAmount col-md-4">Monto a enviar:</label>
              <div class="col-md-8">
                <input id="inputMonto" type="number" class="form-control" id="sendAmount" />
                <div id="alertInfo" class="msgError" id="msgSendAmount"></div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button id="btnCancelarEnvio" type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
            <button id="btnRealizarEnvio" type="button" class="btn btn-primary">Realizar envio</button>            
          </div>
        </div>
      </div>
    </div>
    <!-- /Modal Formulario Monto de envío -->


    <!-- Modal Mensaje -->
    <div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
      aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">Modal title</h5>
          </div>
          <div id="modalBody" class="modal-body">
            ...
          </div>
          <div class="modal-footer">
            <button id="btnSecondaryModal" type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
            <button id="btnPrimaryModal" type="button" class="btn btn-primary" href="./dashboard.html">Aceptar</button>
            <button id="btnEliminarContacto" type="button" class="btn btn-primary">Eliminar contacto</button>
          </div>
        </div>
      </div>
    </div>
    <!-- /Modal Mensaje -->
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
