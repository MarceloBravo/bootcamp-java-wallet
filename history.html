<!DOCTYPE html>

<body>
  <div class="background-screen"></div>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">

      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarText"
        aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarText">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item">
            <a class="nav-link" href="dashboard.html">Dashboard </a>
          </li>
          <li class="nav-item">

          </li>
          <li class="nav-item">

              <option value="send">Transferencia</option>

          </div>
        </div>
        <div class="form-group row">
          <label for="filterTextTransaction" class="form-label col-sm-3">Filtrar por:</label>
          <div class="col-sm-9">
            <input type="text" class="form-control" id="filterTextTransaction" value=""  placeholder="Ingresa el texto o valor a filtrar y presiona Enter">

      <ul id="historial" class="list-group">
